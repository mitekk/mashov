name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # 1. LINT — fast feedback on code quality and TypeScript types
  # ────────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Lint backend
        working-directory: backend
        run: npm run lint

      - name: Typecheck backend
        working-directory: backend
        run: npm run typecheck

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck frontend
        working-directory: frontend
        run: npx tsc --noEmit

  # ────────────────────────────────────────────────────────────────────────────
  # 2. UNIT TESTS — run inside Docker container
  # ────────────────────────────────────────────────────────────────────────────
  unit-test:
    name: Unit Tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Run unit tests with coverage
        run: npm run test:unit

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: backend/coverage/

      - name: Stop Docker stack
        if: always()
        run: docker compose down --remove-orphans

  # ────────────────────────────────────────────────────────────────────────────
  # 3. INTEGRATION TESTS — run inside Docker container
  # ────────────────────────────────────────────────────────────────────────────
  integration-test:
    name: Integration Tests
    needs: unit-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Run integration tests
        run: npm run test:integration

      - name: Stop Docker stack
        if: always()
        run: docker compose down --remove-orphans

  # ────────────────────────────────────────────────────────────────────────────
  # 4. E2E TESTS — full Dockerized stack with Playwright container
  # ────────────────────────────────────────────────────────────────────────────
  e2e:
    name: E2E Tests
    needs: integration-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Create .env for Docker Compose
        run: |
          cat > .env <<'EOF'
          DB_NAME=mashov
          DB_USER=postgres
          DB_PASSWORD=postgres
          DATABASE_URL=postgresql://postgres:postgres@db:5432/mashov
          MASHOV_SEMEL=0
          MASHOV_YEAR=2026
          MASHOV_USERNAME=e2e_test_user
          MASHOV_PASSWORD=e2e_test_pass
          ENCRYPTION_KEY=e2e-test-encryption-key-32chars!
          CORS_ORIGIN=http://localhost:3000
          FEATURE_DAILY_BEHAVE=false
          FEATURE_OUT_BEHAVE=false
          EOF

      - name: Run Playwright E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/

      - name: Stop Docker stack
        if: always()
        run: docker compose down --remove-orphans

  # ────────────────────────────────────────────────────────────────────────────
  # 5. BUILD — verify Docker images build successfully
  # ────────────────────────────────────────────────────────────────────────────
  build:
    name: Docker Build
    needs: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker images
        run: docker compose build
