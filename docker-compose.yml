services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-mashov}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    shm_size: '256mb'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/mashov}
      MASHOV_SEMEL: ${MASHOV_SEMEL}
      MASHOV_YEAR: ${MASHOV_YEAR}
      MASHOV_USERNAME: ${MASHOV_USERNAME}
      MASHOV_PASSWORD: ${MASHOV_PASSWORD}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      FEATURE_DAILY_BEHAVE: ${FEATURE_DAILY_BEHAVE:-false}
      FEATURE_OUT_BEHAVE: ${FEATURE_OUT_BEHAVE:-false}
    ports:
      - "3001:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_URL: http://backend:3000
      NEXT_PUBLIC_API_URL: /api/v1
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  e2e:
    image: mcr.microsoft.com/playwright:v1.58.2-jammy
    profiles: ["test"]
    working_dir: /work
    depends_on:
      frontend:
        condition: service_healthy
    environment:
      CI: "1"
      PLAYWRIGHT_BASE_URL: http://frontend:3000
      PLAYWRIGHT_BACKEND_URL: http://backend:3000
    volumes:
      - ./:/work
    command: ["sh", "-c", "npm ci && npx playwright test --workers=1"]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  db_data:
