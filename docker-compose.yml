services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-mashov}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    shm_size: '256mb'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    image: mashov-backend:latest
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/mashov}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      MASHOV_SEMEL: ${MASHOV_SEMEL}
      MASHOV_YEAR: ${MASHOV_YEAR}
      MASHOV_USERNAME: ${MASHOV_USERNAME}
      MASHOV_PASSWORD: ${MASHOV_PASSWORD}
      MASHOV_BASE_URL: ${MASHOV_BASE_URL:-}
      # Mashov blocks the server's IP, so production egresses through a proxy.
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      # Wall-clock bound per Mashov request (default 10000 in code).
      MASHOV_TIMEOUT_MS: ${MASHOV_TIMEOUT_MS:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      SESSION_LIFETIME_DAYS: ${SESSION_LIFETIME_DAYS:-30}
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-false}
      FEATURE_DAILY_BEHAVE: ${FEATURE_DAILY_BEHAVE:-false}
      FEATURE_OUT_BEHAVE: ${FEATURE_OUT_BEHAVE:-false}
    restart: unless-stopped
    ports:
      - "3001:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/health').then((r) => process.exit(r.status >= 500 ? 1 : 0)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: mashov-frontend:latest
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_URL: http://backend:3000
      # Wall-clock bound per backend call from the proxy route (default 15000).
      PROXY_TIMEOUT_MS: ${PROXY_TIMEOUT_MS:-}
      NEXT_PUBLIC_API_URL: /api/v1
      NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}
      # Opt-in only. Set to 1 by the e2e test commands and CI; must stay 0
      # everywhere else — when enabled, an x-mashov-e2e-auth-bypass header or a
      # mashov-e2e-browser user agent walks straight past the auth guard.
      ENABLE_E2E_AUTH_BYPASS: "${ENABLE_E2E_AUTH_BYPASS:-0}"
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null --tries=1 http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  unit:
    build:
      context: ./backend
      target: builder
    profiles: ["test"]
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@db:5432/mashov
      REDIS_URL: redis://redis:6379
      ENCRYPTION_KEY: test-encryption-key-32-chars-long!
      SESSION_LIFETIME_DAYS: "30"
      MASHOV_SEMEL: "0"
      MASHOV_YEAR: "2026"
      MASHOV_USERNAME: test
      MASHOV_PASSWORD: test
    volumes:
      - ./backend/coverage:/app/coverage
    command: ["npm", "run", "test:coverage"]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  integration:
    image: node:22-alpine
    profiles: ["test"]
    working_dir: /work
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@db:5432/mashov
      REDIS_URL: redis://redis:6379
      ENCRYPTION_KEY: test-encryption-key-32-chars-long!
      SESSION_LIFETIME_DAYS: "30"
      MASHOV_SEMEL: "0"
      MASHOV_YEAR: "2026"
      MASHOV_USERNAME: test
      MASHOV_PASSWORD: test
    volumes:
      - ./:/work
    command:
      [
        "sh",
        "-c",
        "apk add --no-cache openssl >/dev/null && cd backend && npm ci && npx prisma db push --force-reset --skip-generate && cd .. && npm ci && npx jest tests/integration --runInBand --testEnvironment=node --forceExit --testTimeout=30000",
      ]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  e2e:
    image: mcr.microsoft.com/playwright:v1.58.2-jammy
    profiles: ["test"]
    working_dir: /work
    depends_on:
      frontend:
        condition: service_healthy
    environment:
      CI: ${CI:-}
      PLAYWRIGHT_BASE_URL: http://frontend:3000
      PLAYWRIGHT_BACKEND_URL: http://backend:3000
      PLAYWRIGHT_WORKERS: ${PLAYWRIGHT_WORKERS:-}
      PLAYWRIGHT_ARGS: ${PLAYWRIGHT_ARGS:-}
    volumes:
      - ./:/work
      - /work/node_modules
    command: ["sh", "-c", "npm ci --include=dev && npx playwright test ${PLAYWRIGHT_ARGS:-}"]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  db_data:
