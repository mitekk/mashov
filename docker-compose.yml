services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-mashov}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      # Parameterised, default unchanged: the host's 5432 is often already
      # taken by another project's database, and a hardcoded publish made the
      # whole stack unliftable rather than just that one mapping. Containers
      # reach the db as `db:5432` on the compose network, so DB_PORT moves the
      # host side only.
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    shm_size: '256mb'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    image: mashov-backend:latest
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/mashov}
      # Prisma pool sizing. Kept out of DATABASE_URL on purpose: as query
      # parameters on the URL they live inside a masked secret, which is how
      # the default limit of 9 went unnoticed until sixteen cron tasks and the
      # request path started timing out against it. Defaults (25 / 20s) are in
      # src/prisma/prisma-pool.ts; a value pinned in the URL still wins.
      DATABASE_CONNECTION_LIMIT: ${DATABASE_CONNECTION_LIMIT:-}
      DATABASE_POOL_TIMEOUT: ${DATABASE_POOL_TIMEOUT:-}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      MASHOV_YEAR: ${MASHOV_YEAR}
      MASHOV_BASE_URL: ${MASHOV_BASE_URL:-}
      # Mashov blocks the server's IP, so production egresses through a proxy.
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      # Wall-clock bound per Mashov request (default 10000 in code).
      MASHOV_TIMEOUT_MS: ${MASHOV_TIMEOUT_MS:-}
      # Kill switch for the mail unread reconciliation sweep. `false` freezes
      # the inbox badge in place while a wrong count is diagnosed; the inbox
      # walk and the per-conversation derivation keep running either way. Any
      # other value, including unset, leaves the sweep on -- it is what keeps
      # the badge matching Mashov's own unreadConversations.
      MAIL_SWEEP_ENABLED: ${MAIL_SWEEP_ENABLED:-}
      # Whether signing in with a school's credentials attaches to the
      # household that already linked it. `false` restores the pre-merge
      # behaviour, where each school's Mashov account gets its own household --
      # which makes linking a second school a dead end. See ADR-0029.
      MASHOV_ENABLE_SCHOOL_LINK_ADOPTION: ${MASHOV_ENABLE_SCHOOL_LINK_ADOPTION:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      # Per-child daily digest -> Telegram. Off by default, and silent even
      # when on: DIGEST_DRY_RUN renders and logs without sending. See ADR-0026.
      DIGEST_ENABLED: ${DIGEST_ENABLED:-false}
      DIGEST_DRY_RUN: ${DIGEST_DRY_RUN:-true}
      DIGEST_TIMEZONE: ${DIGEST_TIMEZONE:-Asia/Jerusalem}
      DIGEST_DUE_LOOKBACK_DAYS: ${DIGEST_DUE_LOOKBACK_DAYS:-14}
      DIGEST_NEW_LOOKBACK_DAYS: ${DIGEST_NEW_LOOKBACK_DAYS:-3}
      DIGEST_ACTIVITY_WINDOW_DAYS: ${DIGEST_ACTIVITY_WINDOW_DAYS:-7}
      # How long after a child's last lesson ends the register has plausibly
      # been filled in. `0` gates on the bell itself; above 180 is clamped,
      # because minutes read as milliseconds would stop every digest. ADR-0040.
      DIGEST_POST_DISMISSAL_GRACE_MINUTES: ${DIGEST_POST_DISMISSAL_GRACE_MINUTES:-30}
      # Behaviour event codes the digest never reports. 18 is נוכחות, a
      # presence row Mashov writes per lesson per day, which tells a parent
      # nothing. `-` rather than `:-` on purpose: `:-` substitutes the default
      # for an EMPTY value too, which would make "mute nothing" unreachable
      # from .env.
      DIGEST_MUTED_BEHAVIOR_CODES: ${DIGEST_MUTED_BEHAVIOR_CODES-18}
      # How recently a message-board notice must have been seen for the first
      # time to count as news. Measured from MessageBoardItem.firstSeenAt:
      # Mashov sends no creation date and updatedAt churns on every 06:00
      # upsert, so neither can mean "new".
      DIGEST_BOARD_LOOKBACK_DAYS: ${DIGEST_BOARD_LOOKBACK_DAYS:-2}
      DIGEST_LLM_MODEL: ${DIGEST_LLM_MODEL:-claude-sonnet-5-5}
      DIGEST_LLM_EFFORT: ${DIGEST_LLM_EFFORT:-low}
      DIGEST_LLM_TIMEOUT_MS: ${DIGEST_LLM_TIMEOUT_MS:-30000}
      # The origin Telegram messages link back to. Must be the same origin the
      # frontend is served from, because the links are deep links into it
      # (e.g. https://mashov.mitya.dev). Deliberately NOT named NEXT_PUBLIC_*:
      # that prefix means "inlined into the browser bundle" in Next, and this
      # is read by the backend only. Unset -- the default -- means no link line
      # is rendered at all, which is the right failure: a base of `undefined`
      # would put "undefined/inbox/<id>" in a parent's chat.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      # Household mail -> Telegram, as its own message. Off by default and
      # silent even when on, exactly like the digest. The cron fires every ten
      # minutes; the quiet window HOLDS mail over rather than dropping it, so
      # a letter that arrives at 02:00 goes out at 07:00. See ADR-0038.
      INBOX_NOTIFY_ENABLED: ${INBOX_NOTIFY_ENABLED:-false}
      INBOX_NOTIFY_DRY_RUN: ${INBOX_NOTIFY_DRY_RUN:-true}
      INBOX_NOTIFY_QUIET_FROM: ${INBOX_NOTIFY_QUIET_FROM:-21:00}
      INBOX_NOTIFY_QUIET_TO: ${INBOX_NOTIFY_QUIET_TO:-07:00}
      # Also the carry-over window: shorter than the quiet hours are long would
      # lose the mail it is meant to hold.
      INBOX_NOTIFY_LOOKBACK_HOURS: ${INBOX_NOTIFY_LOOKBACK_HOURS:-24}
      # Above this, one summary message goes out instead of a burst.
      INBOX_NOTIFY_MAX_PER_RUN: ${INBOX_NOTIFY_MAX_PER_RUN:-5}
      INBOX_NOTIFY_BODY_CHARS: ${INBOX_NOTIFY_BODY_CHARS:-700}
      # Mashov attachments forwarded into Telegram. Bounds, not switches: the
      # bytes are buffered in memory between the download and the upload, and
      # this cron is the one thing here that can move the process's memory
      # profile. Telegram's own ceilings are 50 MB for a document and 10 MB for
      # a photo upload; these sit well inside them. See ADR-0039.
      TELEGRAM_MEDIA_MAX_BYTES: ${TELEGRAM_MEDIA_MAX_BYTES:-20971520}
      # Above this a jpeg or png goes as a document instead of a photo:
      # sendPhoto re-encodes and downscales, so a scanned slip becomes
      # unreadable.
      TELEGRAM_PHOTO_MAX_BYTES: ${TELEGRAM_PHOTO_MAX_BYTES:-5242880}
      # Per-download override of MASHOV_TIMEOUT_MS. 10s is right for a JSON
      # read and wrong for a multi-megabyte PDF over the residential hop.
      MEDIA_DOWNLOAD_TIMEOUT_MS: ${MEDIA_DOWNLOAD_TIMEOUT_MS:-45000}
      # Defaults to TRUE, unlike the digest's own switches: the feature was
      # asked for, and DIGEST_ENABLED / INBOX_NOTIFY_ENABLED still gate
      # everything that calls it. Only an explicit `false` turns it off.
      TELEGRAM_MEDIA_ENABLED: ${TELEGRAM_MEDIA_ENABLED:-true}
      MEDIA_MAX_FILES_PER_MESSAGE: ${MEDIA_MAX_FILES_PER_MESSAGE:-3}
      MEDIA_TOTAL_BYTES_PER_RUN: ${MEDIA_TOTAL_BYTES_PER_RUN:-52428800}
      # Telegram allows roughly one message per second per chat, tighter in
      # groups, so the uploads are paced rather than burst.
      MEDIA_SEND_DELAY_MS: ${MEDIA_SEND_DELAY_MS:-1100}
      # Parent-driven Telegram linking (ADR-0033). All optional, and all inert
      # without TELEGRAM_BOT_TOKEN below: the poller checks for the token before
      # it starts, and the mint route answers 503.
      TELEGRAM_LINK_CODE_TTL_MINUTES: ${TELEGRAM_LINK_CODE_TTL_MINUTES:-15}
      TELEGRAM_POLL_TIMEOUT_SECONDS: ${TELEGRAM_POLL_TIMEOUT_SECONDS:-30}
      TELEGRAM_POLL_ENABLED: ${TELEGRAM_POLL_ENABLED:-true}
      # Secrets. Never logged; see the note in ADR-0026 about ops/ having no
      # secrets-management path for them yet.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      SESSION_LIFETIME_DAYS: ${SESSION_LIFETIME_DAYS:-30}
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-false}
      # Operator feedback delivery (ADR-0045). These two are the address, and
      # they are the only switch: both set means on, either one missing means
      # off, silently, with the two-minute cron doing no work and writing no
      # line. There is deliberately no third FEEDBACK_NOTIFY_ENABLED var -- see
      # the doc comment on FeedbackNotifierService.
      #
      # FEEDBACK_TELEGRAM_BOT_TOKEN is a DIFFERENT bot from TELEGRAM_BOT_TOKEN
      # above, on purpose. The operator of this app is also a parent user of
      # it, so one bot would interleave every parent's bug report with that
      # operator's own children's digests in a single conversation. A second
      # bot also means revoking the feedback credential cannot stop a parent's
      # digest. There is no fallback: with this unset and TELEGRAM_BOT_TOKEN
      # set, nothing is sent rather than a report going out as the bot parents
      # talk to.
      #
      # FEEDBACK_TELEGRAM_CHAT_ID is the private channel's `-100...` id. The
      # bot must be an ADMIN of that channel with post rights; until it is,
      # Telegram refuses every send and the rows park rather than retiring.
      # See docs/ops/admin-access-setup.md.
      FEEDBACK_TELEGRAM_BOT_TOKEN: ${FEEDBACK_TELEGRAM_BOT_TOKEN:-}
      FEEDBACK_TELEGRAM_CHAT_ID: ${FEEDBACK_TELEGRAM_CHAT_ID:-}
      FEEDBACK_NOTIFY_MAX_PER_RUN: ${FEEDBACK_NOTIFY_MAX_PER_RUN:-20}
      # Operator-only admin surface (ADR-0045). `verify` is the default, and
      # without ACCESS_AUD and ACCESS_TEAM_DOMAIN it closes the surface rather
      # than opening it: every /api/v1/admin/* call answers 403. So an ordinary
      # dev stack boots with the admin API shut, and a prod deploy that forgets
      # the Access vars serves no reports. `insecure-dev` turns verification
      # off and is therefore the one combination that refuses to boot unless
      # ENABLE_E2E_AUTH_BYPASS=1 is also set below -- two independent switches,
      # both default off.
      ADMIN_AUTH_MODE: ${ADMIN_AUTH_MODE:-verify}
      ACCESS_AUD: ${ACCESS_AUD:-}
      ACCESS_TEAM_DOMAIN: ${ACCESS_TEAM_DOMAIN:-}
      # Opt-in only, same flag the frontend reads; must stay 0 everywhere but
      # the e2e run. Here it is the second switch ADMIN_AUTH_MODE=insecure-dev
      # needs before it is accepted.
      ENABLE_E2E_AUTH_BYPASS: "${ENABLE_E2E_AUTH_BYPASS:-0}"
      FEATURE_DAILY_BEHAVE: ${FEATURE_DAILY_BEHAVE:-false}
      FEATURE_OUT_BEHAVE: ${FEATURE_OUT_BEHAVE:-false}
      # The build this process is. Stamped onto a feedback row when the client
      # sends none.
      #
      # Pass-through (no value), NOT `${APP_VERSION:-}`: the latter sets the
      # variable to an empty string whenever the operator has not exported one,
      # which would override the version CI baked into the image and send the
      # backend back to its package.json version. With no value, compose
      # forwards it only when it is actually set, and the baked ENV survives.
      APP_VERSION:
    restart: unless-stopped
    ports:
      # Parameterised for the same reason as DB_PORT above: a hardcoded publish
      # made the whole stack unliftable when another checkout of this project
      # already held the port, rather than failing only that one mapping. The
      # frontend proxy reaches the backend as `backend:3000` on the compose
      # network, so BACKEND_PORT moves the host side only.
      - "${BACKEND_PORT:-3001}:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/health').then((r) => process.exit(r.status >= 500 ? 1 : 0)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: mashov-frontend:latest
    build:
      context: ./frontend
      args:
        # A BUILD arg, not only an environment variable: Next inlines every
        # NEXT_PUBLIC_* read in a "use client" module at build time, and both
        # readers (the /more footer and the feedback dialog) are client
        # components. Setting it at runtime alone would leave them with
        # `undefined`.
        #
        # Optional. Unset, next.config.ts falls back to frontend/package.json's
        # version, so nothing here must be configured for the app to report a
        # version. Set it to stamp a real build -- a tag, a git sha.
        APP_VERSION: ${APP_VERSION:-}
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_URL: http://backend:3000
      # Wall-clock bound per backend call from the proxy route (default 15000).
      PROXY_TIMEOUT_MS: ${PROXY_TIMEOUT_MS:-}
      # Larger bound for synchronous long-running paths (/api/v1/sync/*, default
      # 90000): POST /sync/refresh runs every sync task before it responds, so the
      # ordinary bound above would 504 a slow-but-successful refresh.
      PROXY_SLOW_TIMEOUT_MS: ${PROXY_SLOW_TIMEOUT_MS:-}
      # Bound for attachment downloads (/api/v1/{mail,children}/**/files/*,
      # default 45000): a single file can walk many candidate upstream URLs at
      # MASHOV_TIMEOUT_MS each before one answers.
      PROXY_ATTACHMENT_TIMEOUT_MS: ${PROXY_ATTACHMENT_TIMEOUT_MS:-}
      NEXT_PUBLIC_API_URL: /api/v1
      NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}
      # Opt-in only. Set to 1 by the e2e test commands and CI; must stay 0
      # everywhere else — when enabled, an x-mashov-e2e-auth-bypass header or a
      # mashov-e2e-browser user agent walks straight past the auth guard.
      ENABLE_E2E_AUTH_BYPASS: "${ENABLE_E2E_AUTH_BYPASS:-0}"
    volumes:
      # The optimizer re-encodes on every miss and there is no CDN absorbing it,
      # so the encoded variants must outlive a restart and a redeploy.
      - frontend_image_cache:/app/.next/cache/images
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null --tries=1 http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Throwaway Postgres for the test profile only.
  #
  # The integration suite runs `prisma db push --force-reset`, which DROPS every
  # table. Pointed at the `db` service it wipes the developer's own synced
  # Mashov data -- which is exactly what happened on 2026-11-19, taking the
  # household connection and every conversation with it.
  #
  # A separate database *name* on the same server would have fixed that case,
  # but leaves the dev data one typo away forever. A separate instance makes it
  # unreachable from the test profile by construction.
  #
  # tmpfs, so the data never touches a volume and every run starts clean.
  db-test:
    image: postgres:16-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: mashov
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    tmpfs:
      - /var/lib/postgresql/data
    shm_size: '256mb'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  unit:
    build:
      context: ./backend
      target: builder
    profiles: ["test"]
    working_dir: /app
    depends_on:
      db-test:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@db-test:5432/mashov
      REDIS_URL: redis://redis:6379
      ENCRYPTION_KEY: "00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff"
      SESSION_LIFETIME_DAYS: "30"
      # Extra jest flags, used by the PR-relevant test selection (see
      # scripts/select-tests.mjs). Empty here runs the whole suite exactly as
      # before; a narrowed run passes
      # `--findRelatedTests <files> --coverage=false --passWithNoTests`, with
      # paths relative to THIS directory -- /app is backend/, not the repo root.
      JEST_ARGS: ${JEST_ARGS:-}
    volumes:
      - ./backend/coverage:/app/coverage
    # `--maxWorkers=2` is load-bearing, not tuning. Jest defaults to one worker
    # per core, each a full Node process, and the container has no memory limit
    # of its own -- so on a machine with many cores the OS OOM killer takes
    # workers out mid-suite. That surfaces as
    # "a jest worker process was terminated by another process: signal=SIGKILL"
    # against suites that are individually fine, and the exit code is non-zero
    # with ZERO failing tests, which reads like a broken test and is not one.
    # Reached once the suite count passed ~85. Bounded here rather than in the
    # package.json script so a developer's own `jest` run keeps full
    # parallelism.
    # Shell form, not exec form, so ${JEST_ARGS} actually expands.
    command: ["sh", "-c", "npm run test:coverage -- --maxWorkers=2 ${JEST_ARGS:-}"]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  integration:
    image: node:22-alpine
    profiles: ["test"]
    working_dir: /work
    depends_on:
      db-test:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@db-test:5432/mashov
      REDIS_URL: redis://redis:6379
      ENCRYPTION_KEY: "00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff"
      SESSION_LIFETIME_DAYS: "30"
      # Which integration specs to run, used by the PR-relevant test selection
      # (see scripts/select-tests.mjs). Empty falls back to the whole
      # `tests/integration` directory, exactly as before.
      INTEGRATION_ARGS: ${INTEGRATION_ARGS:-}
    volumes:
      - ./:/work
    command:
      [
        "sh",
        "-c",
        "apk add --no-cache openssl >/dev/null && cd backend && npm ci && npx prisma db push --force-reset --skip-generate && cd .. && npm ci && npx jest ${INTEGRATION_ARGS:-tests/integration} --runInBand --testEnvironment=node --forceExit --testTimeout=30000 --testPathIgnorePatterns=/node_modules/ --testPathIgnorePatterns=worktrees/",
      ]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  e2e:
    image: mcr.microsoft.com/playwright:v1.58.2-jammy
    profiles: ["test"]
    working_dir: /work
    # Chromium puts its shared-memory buffers in /dev/shm, and Docker's default
    # is 64MB -- enough for one tab on an idle machine, not for Playwright's
    # default worker count. When it runs out the symptom is not an assertion
    # failure but `Page crashed` on `page.goto`, scattered across unrelated
    # specs and projects, which reads exactly like a flaky app. The same rule
    # .claude/rules/docker.md already states for postgres.
    shm_size: '1gb'
    depends_on:
      frontend:
        condition: service_healthy
    environment:
      CI: ${CI:-}
      PLAYWRIGHT_BASE_URL: http://frontend:3000
      PLAYWRIGHT_BACKEND_URL: http://backend:3000
      PLAYWRIGHT_WORKERS: ${PLAYWRIGHT_WORKERS:-}
      PLAYWRIGHT_ARGS: ${PLAYWRIGHT_ARGS:-}
    volumes:
      - ./:/work
      - /work/node_modules
    command: ["sh", "-c", "npm ci --include=dev && npx playwright test ${PLAYWRIGHT_ARGS:-}"]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  db_data:
  frontend_image_cache:
